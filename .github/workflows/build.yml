# On every push: checks the code and builds the place file (.rbxl) to download.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo and luau-lsp
        run: |
          mkdir -p tools && cd tools
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -oq rojo.zip
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -oq lsp.zip
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          chmod +x rojo luau-lsp

      - name: Type-check the code
        run: |
          tools/rojo sourcemap default.project.json -o sourcemap.json
          tools/luau-lsp analyze --definitions=tools/globalTypes.d.luau --sourcemap=sourcemap.json src

      - name: Build the place
        run: tools/rojo build default.project.json -o collect-brainrot-cards.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: collect-brainrot-cards
          path: collect-brainrot-cards.rbxl
